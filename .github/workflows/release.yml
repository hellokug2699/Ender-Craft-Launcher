name: ECL channel builds

on:
  push:
    branches: [dev, nightly]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same channel supersedes an older queued build.
# Stable tags are unique refs, so they are not cancelled by other releases.
concurrency:
  group: ecl-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish channel snapshot
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version and channel from branch
        shell: pwsh
        env:
          ECL_REF_NAME: ${{ github.ref_name }}
          ECL_REF_TYPE: ${{ github.ref_type }}
          ECL_RUN_NUMBER: ${{ github.run_number }}
          ECL_RUN_ATTEMPT: ${{ github.run_attempt }}
          ECL_COMMIT_SHA: ${{ github.sha }}
        run: |
          $base = [xml](Get-Content "Directory.Build.props" -Raw)
          $baseVersion = [string]$base.Project.PropertyGroup.VersionPrefix
          if ($baseVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Directory.Build.props VersionPrefix must be MAJOR.MINOR.PATCH."
          }

          if ($env:ECL_REF_TYPE -eq "tag") {
            $version = $env:ECL_REF_NAME -replace '^v', ''
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release tags must be stable SemVer tags such as v1.2.3."
            }
            $channel = "main"
          }
          else {
            $channel = $env:ECL_REF_NAME
            if ($channel -notin @("dev", "nightly")) {
              throw "workflow_dispatch must target dev or nightly; stable releases are tag-only."
            }

            $date = [DateTime]::UtcNow.ToString("yyyyMMdd")
            $attempt = [int]$env:ECL_RUN_ATTEMPT
            $version = "$baseVersion-$channel.$date.$($env:ECL_RUN_NUMBER).$attempt"
          }

          "ECL_VERSION=$version" >> $env:GITHUB_ENV
          "ECL_CHANNEL=$channel" >> $env:GITHUB_ENV
          "ECL_RELEASE_TITLE=ECL $channel (latest: $version)" >> $env:GITHUB_ENV
          @"
          ECL $version
          Channel: $channel
          Commit: $env:ECL_COMMIT_SHA
          Build: $env:GITHUB_RUN_NUMBER (attempt $env:ECL_RUN_ATTEMPT)

          This is the latest rolling $channel build. Older build history is available
          in GitHub Actions artifacts and workflow runs.

          普通用户只需下载并运行 ECL.Installer-$version-win-x64.exe。
          只有需要独立修复入口时才下载 ECL.Bootstrapper-$version-win-x64.exe。
          日常自动更新由签名频道 Feed 提供；Package 不作为人工 Release 附件。
          "@ | Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8NoBOM

      - name: Materialize update signing key
        shell: pwsh
        env:
          ECL_UPDATE_SIGNING_KEY_SECRET: ${{ secrets.ECL_UPDATE_SIGNING_KEY }}
          ECL_CORE_READ_TOKEN: ${{ secrets.ECL_CORE_READ_TOKEN }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ecl-update-signing.key"
          if (-not [string]::IsNullOrWhiteSpace($env:ECL_UPDATE_SIGNING_KEY_SECRET)) {
            [System.IO.File]::WriteAllText($keyPath, $env:ECL_UPDATE_SIGNING_KEY_SECRET, [System.Text.UTF8Encoding]::new($false))
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:ECL_CORE_READ_TOKEN)) {
            $headers = @{
              Authorization = "Bearer $env:ECL_CORE_READ_TOKEN"
              Accept = "application/vnd.github.raw+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            Invoke-RestMethod -Headers $headers `
              -Uri "https://api.github.com/repos/hellokug2699/Ender-Craft-Launcher-Core/contents/signing/update-signing.key" `
              -OutFile $keyPath
          }
          else {
            throw "No update signing key. Configure ECL_UPDATE_SIGNING_KEY or ECL_CORE_READ_TOKEN."
          }

          $trust = Get-Content "build/update-trust.json" -Raw | ConvertFrom-Json
          $expected = [string]$trust.keys[0].publicKey
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([System.IO.File]::ReadAllText($keyPath))
            $actual = $rsa.ExportSubjectPublicKeyInfoPem()
          }
          finally { $rsa.Dispose() }
          if ($actual.Trim() -ne $expected.Trim()) {
            throw "Signing key does not match build/update-trust.json."
          }
          "ECL_UPDATE_SIGNING_KEY=$keyPath" >> $env:GITHUB_ENV

      - name: Build signed release artifacts
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/pack-release.ps1 `
            -Version $env:ECL_VERSION `
            -Channel $env:ECL_CHANNEL `
            -OutputRoot "artifacts/release" `
            -SigningKeyPath $env:ECL_UPDATE_SIGNING_KEY `
            -KeyId "ecl-release-2026-11" `
            -TrustStorePath "build/update-trust.json" `
            -SelfContained `
            -ReleaseNotes (Get-Content "$env:RUNNER_TEMP/release-notes.md" -Raw)
          if ($LASTEXITCODE -ne 0) { throw "pack-release failed" }

      - name: Collect human-facing assets and write release notes
        shell: pwsh
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $installer = Join-Path $dir "ECL.Installer-$env:ECL_VERSION-win-x64.exe"
          $bootstrapper = Join-Path $dir "bootstrapper/ECL.Bootstrapper.exe"
          $package = Join-Path $dir "ECL-$env:ECL_VERSION-win-x64.zip"
          foreach ($required in @($installer, $bootstrapper, $package, (Join-Path $dir "update-manifest.json"), (Join-Path $dir "update-manifest.sig"))) {
            if (-not (Test-Path $required)) { throw "Release artifact missing: $required" }
          }
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $bootstrapperHash = (Get-FileHash $bootstrapper -Algorithm SHA256).Hash.ToLowerInvariant()
          @"
          ECL $env:ECL_VERSION
          Channel: $env:ECL_CHANNEL
          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_RUN_NUMBER (attempt $env:GITHUB_RUN_ATTEMPT)

          **普通用户：**只需下载并运行 Installer。
          **独立修复：**只有在必要时才下载 Bootstrapper。

          SHA-256:
          - ECL.Installer-$env:ECL_VERSION-win-x64.exe: $installerHash
          - ECL.Bootstrapper-$env:ECL_VERSION-win-x64.exe: $bootstrapperHash

          日常自动更新由 ECL 的签名频道 Feed 提供，不需要手动下载 Package。
          "@ | Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8NoBOM
          Get-ChildItem $dir | Select-Object Name, Length

      # Every build remains independently downloadable for a limited period.
      # The updater does not consume Actions artifacts; it uses the signed rolling feed below.
      - name: Archive this build in Actions
        uses: actions/upload-artifact@v4
        with:
          name: ECL-${{ env.ECL_VERSION }}-${{ env.ECL_CHANNEL }}-${{ github.sha }}
          path: artifacts/release/${{ env.ECL_VERSION }}/
          if-no-files-found: error
          retention-days: 14

      # Never interrupt a publication halfway through. Older branch builds are
      # retained as Actions artifacts, but only the current branch head updates the feed.
      - name: Check whether this is the latest channel commit
        id: freshness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ECL_REF_TYPE: ${{ github.ref_type }}
          ECL_CHANNEL: ${{ env.ECL_CHANNEL }}
        run: |
          if ($env:ECL_REF_TYPE -eq "tag") {
            "publish=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/$env:ECL_CHANNEL" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($head)) {
            throw "Failed to resolve current branch head for $env:ECL_CHANNEL"
          }
          $shouldPublish = ($head.Trim() -eq $env:GITHUB_SHA)
          "publish=$($shouldPublish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $shouldPublish) {
            Write-Host "Skipping stale channel publication for $env:GITHUB_SHA; current head is $head."
          }

      - name: Check package publishing script syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content "build/publish-channel-feed.ps1" -Raw))
          Write-Host "Channel feed publishing script parsed successfully."

      - name: Publish immutable stable Release
        if: steps.freshness.outputs.publish == 'true' && env.ECL_CHANNEL == 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $installer = Join-Path $dir "ECL.Installer-$env:ECL_VERSION-win-x64.exe"
          $bootstrapper = Join-Path $dir "bootstrapper/ECL.Bootstrapper.exe"
          $tag = "v$env:ECL_VERSION"
          $assets = @($installer, $bootstrapper)
          gh release view $tag --json assets 2>$null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $tagSha.Trim() -ne $env:GITHUB_SHA) {
              throw "Existing stable tag $tag does not point to this exact build commit."
            }
            $oldAssets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Unable to enumerate existing assets for $tag." }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Unable to refresh the two stable EXEs." }
            gh release edit $tag --title "ECL $env:ECL_VERSION" --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw "Unable to update stable Release notes." }
            $allowed = @(
              "ECL.Installer-$env:ECL_VERSION-win-x64.exe",
              "ECL.Bootstrapper-$env:ECL_VERSION-win-x64.exe"
            )
            foreach ($oldAsset in $oldAssets) {
              if ($oldAsset -and $oldAsset -notin $allowed) {
                gh release delete-asset $tag $oldAsset --yes
                if ($LASTEXITCODE -ne 0) { throw "Unable to remove obsolete stable asset $oldAsset." }
              }
            }
          }
          else {
            gh release create $tag @assets `
              --title "ECL $env:ECL_VERSION" `
              --notes-file "$env:RUNNER_TEMP/release-notes.md" `
              --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Failed to create immutable stable Release." }
          }

      - name: Setup Node.js for Wrangler
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish signed channel feeds to Cloudflare Pages
        if: steps.freshness.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ECL_REF_TYPE: ${{ github.ref_type }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pwsh -NoProfile -File build/publish-channel-feed.ps1 `
            -Channel $env:ECL_CHANNEL `
            -Version $env:ECL_VERSION `
            -ReleaseDirectory "artifacts/release/$env:ECL_VERSION" `
            -SigningKeyPath $env:ECL_UPDATE_SIGNING_KEY `
            -KeyId "ecl-release-2026-11" `
            -TrustStorePath "build/update-trust.json"
          if ($LASTEXITCODE -ne 0) { throw "Channel Feed publishing failed." }

      - name: Normalize historical Releases to Installer and Bootstrapper EXEs
        if: steps.freshness.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(gh release list --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')
          if ($LASTEXITCODE -ne 0) { throw "Unable to enumerate historical Releases." }
          foreach ($tag in $tags) {
            if ($tag -in @("main", "dev", "nightly")) { continue }
            $assets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Unable to inspect Release $tag." }
            $installerName = $assets | Where-Object { $_ -match '^ECL\.Installer-.+-win-x64\.exe      # is live and its three-channel Production deployment has passed smoke tests.
      - name: Publish human-facing Release with exactly two EXEs
        if: steps.freshness.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $installer = Join-Path $dir "ECL.Installer-$env:ECL_VERSION-win-x64.exe"
          $bootstrapper = Join-Path $dir "bootstrapper/ECL.Bootstrapper.exe"
          $notes = "$env:RUNNER_TEMP/release-notes.md"
          $assets = @($installer, $bootstrapper)

          if ($env:ECL_CHANNEL -eq "main") {
            # The immutable versioned Release was published before Feed deployment.
            $tag = "main"
            $releaseTitle = "ECL main (latest: $env:ECL_VERSION)"
          }
          else {
            $tag = $env:ECL_CHANNEL
            $releaseTitle = $env:ECL_RELEASE_TITLE
          }

          gh release view $tag 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $oldAssets = @()
          if ($releaseExists) {
            $oldAssets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Failed to enumerate existing assets for $tag." }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload the two EXEs for $tag." }
            if ($env:ECL_CHANNEL -eq "main") {
              gh release edit $tag --title $releaseTitle --notes-file $notes
            }
            else {
              gh release edit $tag --title $releaseTitle --notes-file $notes --prerelease
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to update Release metadata for $tag." }
          }
          else {
            $createArgs = @("release", "create", $tag) + $assets + @("--title", $releaseTitle, "--notes-file", $notes, "--target", $env:GITHUB_SHA)
            if ($env:ECL_CHANNEL -ne "main") { $createArgs += "--prerelease" }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create rolling Release $tag." }
          }

          # Move the rolling tag only after both human-facing assets are uploaded.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Failed to move rolling Release tag $tag." }

          $allowedNames = @(
            "ECL.Installer-$env:ECL_VERSION-win-x64.exe",
            "ECL.Bootstrapper-$env:ECL_VERSION-win-x64.exe"
          )
          foreach ($oldAsset in $oldAssets) {
            if ($oldAsset -and $oldAsset -notin $allowedNames) {
              gh release delete-asset $tag $oldAsset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove obsolete Release asset $oldAsset." }
            }
          }

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ecl-update-signing.key"
          if (Test-Path $keyPath) { Remove-Item $keyPath -Force }
 } | Select-Object -First 1
            if (-not $installerName) {
              Write-Warning "Skipping $tag: no standalone Installer EXE exists."
              continue
            }
            $version = $installerName -replace '^ECL\.Installer-(.+)-win-x64\.exe      # is live and its three-channel Production deployment has passed smoke tests.
      - name: Publish human-facing Release with exactly two EXEs
        if: steps.freshness.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $installer = Join-Path $dir "ECL.Installer-$env:ECL_VERSION-win-x64.exe"
          $bootstrapper = Join-Path $dir "bootstrapper/ECL.Bootstrapper.exe"
          $notes = "$env:RUNNER_TEMP/release-notes.md"
          $assets = @($installer, $bootstrapper)

          if ($env:ECL_CHANNEL -eq "main") {
            # The immutable versioned Release was published before Feed deployment.
            $tag = "main"
            $releaseTitle = "ECL main (latest: $env:ECL_VERSION)"
          }
          else {
            $tag = $env:ECL_CHANNEL
            $releaseTitle = $env:ECL_RELEASE_TITLE
          }

          gh release view $tag 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          $oldAssets = @()
          if ($releaseExists) {
            $oldAssets = @(gh release view $tag --json assets --jq '.assets[].name')
            if ($LASTEXITCODE -ne 0) { throw "Failed to enumerate existing assets for $tag." }
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload the two EXEs for $tag." }
            if ($env:ECL_CHANNEL -eq "main") {
              gh release edit $tag --title $releaseTitle --notes-file $notes
            }
            else {
              gh release edit $tag --title $releaseTitle --notes-file $notes --prerelease
            }
            if ($LASTEXITCODE -ne 0) { throw "Failed to update Release metadata for $tag." }
          }
          else {
            $createArgs = @("release", "create", $tag) + $assets + @("--title", $releaseTitle, "--notes-file", $notes, "--target", $env:GITHUB_SHA)
            if ($env:ECL_CHANNEL -ne "main") { $createArgs += "--prerelease" }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create rolling Release $tag." }
          }

          # Move the rolling tag only after both human-facing assets are uploaded.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Failed to move rolling Release tag $tag." }

          $allowedNames = @(
            "ECL.Installer-$env:ECL_VERSION-win-x64.exe",
            "ECL.Bootstrapper-$env:ECL_VERSION-win-x64.exe"
          )
          foreach ($oldAsset in $oldAssets) {
            if ($oldAsset -and $oldAsset -notin $allowedNames) {
              gh release delete-asset $tag $oldAsset --yes
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove obsolete Release asset $oldAsset." }
            }
          }

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ecl-update-signing.key"
          if (Test-Path $keyPath) { Remove-Item $keyPath -Force }
, '$1'
            $bootstrapperName = "ECL.Bootstrapper-$version-win-x64.exe"
            if ($bootstrapperName -notin $assets) {
              $bootstrapperZip = $assets | Where-Object { $_ -eq "ECL.Bootstrapper-$version-win-x64.zip" } | Select-Object -First 1
              if (-not $bootstrapperZip) {
                Write-Warning "Skipping $tag: no matching standalone Bootstrapper or Bootstrapper ZIP exists."
                continue
              }
              $temp = Join-Path $env:RUNNER_TEMP "ecl-release-clean-$([Guid]::NewGuid().ToString('N'))"
              New-Item -ItemType Directory -Force -Path $temp | Out-Null
              gh release download $tag --pattern $bootstrapperZip --dir $temp
              if ($LASTEXITCODE -ne 0) { throw "Unable to download $bootstrapperZip from $tag." }
              $extract = Join-Path $temp "extract"
              Expand-Archive -Path (Join-Path $temp $bootstrapperZip) -DestinationPath $extract -Force
              $source = Get-ChildItem $extract -Filter "ECL.Bootstrapper.exe" -File -Recurse | Select-Object -First 1
              if (-not $source) { throw "Bootstrapper archive in $tag does not contain ECL.Bootstrapper.exe." }
              $bootstrapperPath = Join-Path $temp $bootstrapperName
              Copy-Item $source.FullName $bootstrapperPath
              gh release upload $tag $bootstrapperPath --clobber
              if ($LASTEXITCODE -ne 0) { throw "Unable to add standalone Bootstrapper to $tag." }
              Remove-Item $temp -Recurse -Force
            }

            foreach ($asset in $assets) {
              if ($asset -and $asset -notin @($installerName, $bootstrapperName)) {
                gh release delete-asset $tag $asset --yes
                if ($LASTEXITCODE -ne 0) { throw "Unable to remove obsolete asset $asset from $tag." }
              }
            }
          }

