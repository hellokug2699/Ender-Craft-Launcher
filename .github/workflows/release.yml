name: ECL channel builds

on:
  push:
    branches: [dev, nightly]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same channel supersedes an older queued build.
# Stable tags are unique refs, so they are not cancelled by other releases.
concurrency:
  group: ecl-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, sign and publish channel snapshot
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version and channel from branch
        shell: pwsh
        env:
          ECL_REF_NAME: ${{ github.ref_name }}
          ECL_REF_TYPE: ${{ github.ref_type }}
          ECL_RUN_NUMBER: ${{ github.run_number }}
          ECL_RUN_ATTEMPT: ${{ github.run_attempt }}
          ECL_COMMIT_SHA: ${{ github.sha }}
        run: |
          $base = [xml](Get-Content "Directory.Build.props" -Raw)
          $baseVersion = [string]$base.Project.PropertyGroup.VersionPrefix
          if ($baseVersion -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Directory.Build.props VersionPrefix must be MAJOR.MINOR.PATCH."
          }

          if ($env:ECL_REF_TYPE -eq "tag") {
            $version = $env:ECL_REF_NAME -replace '^v', ''
            if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              throw "Release tags must be stable SemVer tags such as v1.2.3."
            }
            $channel = "main"
          }
          else {
            $channel = $env:ECL_REF_NAME
            if ($channel -notin @("dev", "nightly")) {
              throw "workflow_dispatch must target dev or nightly; stable releases are tag-only."
            }

            $date = [DateTime]::UtcNow.ToString("yyyyMMdd")
            $attempt = [int]$env:ECL_RUN_ATTEMPT
            $version = "$baseVersion-$channel.$date.$($env:ECL_RUN_NUMBER).$attempt"
          }

          "ECL_VERSION=$version" >> $env:GITHUB_ENV
          "ECL_CHANNEL=$channel" >> $env:GITHUB_ENV
          "ECL_RELEASE_TITLE=ECL $channel (latest: $version)" >> $env:GITHUB_ENV
          @"
          ECL $version
          Channel: $channel
          Commit: $env:ECL_COMMIT_SHA
          Build: $env:GITHUB_RUN_NUMBER (attempt $env:ECL_RUN_ATTEMPT)

          This is the latest rolling $channel build. Older build history is available
          in GitHub Actions artifacts and workflow runs.
          "@ | Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8NoBOM

      - name: Materialize update signing key
        shell: pwsh
        env:
          ECL_UPDATE_SIGNING_KEY_SECRET: ${{ secrets.ECL_UPDATE_SIGNING_KEY }}
          ECL_CORE_READ_TOKEN: ${{ secrets.ECL_CORE_READ_TOKEN }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ecl-update-signing.key"
          if (-not [string]::IsNullOrWhiteSpace($env:ECL_UPDATE_SIGNING_KEY_SECRET)) {
            [System.IO.File]::WriteAllText($keyPath, $env:ECL_UPDATE_SIGNING_KEY_SECRET, [System.Text.UTF8Encoding]::new($false))
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:ECL_CORE_READ_TOKEN)) {
            $headers = @{
              Authorization = "Bearer $env:ECL_CORE_READ_TOKEN"
              Accept = "application/vnd.github.raw+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            Invoke-RestMethod -Headers $headers `
              -Uri "https://api.github.com/repos/hellokug2699/Ender-Craft-Launcher-Core/contents/signing/update-signing.key" `
              -OutFile $keyPath
          }
          else {
            throw "No update signing key. Configure ECL_UPDATE_SIGNING_KEY or ECL_CORE_READ_TOKEN."
          }

          $trust = Get-Content "build/update-trust.json" -Raw | ConvertFrom-Json
          $expected = [string]$trust.keys[0].publicKey
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $rsa.ImportFromPem([System.IO.File]::ReadAllText($keyPath))
            $actual = $rsa.ExportSubjectPublicKeyInfoPem()
          }
          finally { $rsa.Dispose() }
          if ($actual.Trim() -ne $expected.Trim()) {
            throw "Signing key does not match build/update-trust.json."
          }
          "ECL_UPDATE_SIGNING_KEY=$keyPath" >> $env:GITHUB_ENV

      - name: Build signed release artifacts
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/pack-release.ps1 `
            -Version $env:ECL_VERSION `
            -Channel $env:ECL_CHANNEL `
            -OutputRoot "artifacts/release" `
            -SigningKeyPath $env:ECL_UPDATE_SIGNING_KEY `
            -KeyId "ecl-release-2026-11" `
            -TrustStorePath "build/update-trust.json" `
            -ReleaseNotes (Get-Content "$env:RUNNER_TEMP/release-notes.md" -Raw)
          if ($LASTEXITCODE -ne 0) { throw "pack-release failed" }

      - name: Collect assets
        shell: pwsh
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $boot = Join-Path $dir "ECL.Bootstrapper-$env:ECL_VERSION-win-x64.zip"
          Compress-Archive -Path (Join-Path $dir "bootstrapper/*") -DestinationPath $boot -Force
          Get-ChildItem $dir | Select-Object Name, Length

      # Every build remains independently downloadable for a limited period.
      # The updater does not consume Actions artifacts; it uses the signed rolling feed below.
      - name: Archive this build in Actions
        uses: actions/upload-artifact@v4
        with:
          name: ECL-${{ env.ECL_VERSION }}-${{ env.ECL_CHANNEL }}-${{ github.sha }}
          path: artifacts/release/${{ env.ECL_VERSION }}/
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable release or update rolling channel feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "artifacts/release/$env:ECL_VERSION"
          $assets = @(
            (Join-Path $dir "ECL-$env:ECL_VERSION-win-x64.zip"),
            (Join-Path $dir "ECL.Bootstrapper-$env:ECL_VERSION-win-x64.zip"),
            (Join-Path $dir "update-manifest.json"),
            (Join-Path $dir "update-manifest.sig"),
            (Join-Path $dir "update-trust.json")
          )
          $notes = "$env:RUNNER_TEMP/release-notes.md"

          if ($env:ECL_CHANNEL -eq "main") {
            $tag = "v$env:ECL_VERSION"
            gh release create $tag @assets --title "ECL $env:ECL_VERSION" --notes-file $notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish stable release $tag" }
            exit 0
          }

          # One mutable Release per prerelease channel: no per-commit Release spam.
          $tag = $env:ECL_CHANNEL
          gh release view $tag 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload rolling assets for $tag" }
            gh release edit $tag --title "$env:ECL_RELEASE_TITLE" --notes-file $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to update rolling release metadata for $tag" }
          }
          else {
            gh release create $tag @assets --title "$env:ECL_RELEASE_TITLE" --notes-file $notes --prerelease --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Failed to create rolling release $tag" }
          }

          # gh release upload does not move an existing tag. Move it only after all
          # assets are uploaded so the channel tag always identifies the published build.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw "Failed to move rolling channel tag $tag to $env:GITHUB_SHA" }

      - name: Remove signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ecl-update-signing.key"
          if (Test-Path $keyPath) { Remove-Item $keyPath -Force }
