name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ECL.sln

      - name: Verify commit hygiene
        shell: pwsh
        run: ./scripts/check-commit-hygiene.ps1 -All

      - name: Validate release PowerShell script syntax
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content "build/publish-channel-feed.ps1" -Raw))
          [void][scriptblock]::Create((Get-Content "build/validate-installer.ps1" -Raw))
          Write-Host "Release PowerShell scripts parsed successfully."

      - name: Build
        run: dotnet build ECL.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format ECL.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-build

      # WPF 线程/Dispatcher 契约与有界输出管线只能在实际 Windows UI 线程上验证。
      - name: Test WPF shell stabilization
        run: dotnet test tests/ECL.App.Tests/ECL.App.Tests.csproj -c Release --no-build

      # Reuse the exact signed Installer/Bootstrapper smoke test in release publishing.
      - name: Verify silent install and tampered media rejection
        shell: pwsh
        run: pwsh -NoProfile -File build/validate-installer.ps1

  linux:
    name: Test (Linux, Core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/ECL.Tests/ECL.Tests.csproj

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-restore
