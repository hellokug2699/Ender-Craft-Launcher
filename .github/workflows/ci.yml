name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ECL.sln

      - name: Build
        run: dotnet build ECL.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format ECL.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-build

  linux:
    name: Test (Linux, Core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/ECL.Tests/ECL.Tests.csproj

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-restore
