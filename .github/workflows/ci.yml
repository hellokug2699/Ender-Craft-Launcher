name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ECL.sln

      - name: Verify commit hygiene
        shell: pwsh
        run: ./scripts/check-commit-hygiene.ps1 -All

      - name: Build
        run: dotnet build ECL.sln -c Release --no-restore

      - name: Verify formatting
        run: dotnet format ECL.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-build

      # 未签名打包只用于验证发布脚本与安装介质组装；签名产物仍由 release workflow 生成。
      - name: Verify release packaging and installer media
        shell: pwsh
        run: |
          dotnet build src/ECL.Installer/ECL.Installer.csproj -c Release --no-restore
          pwsh -NoProfile -File build/pack-release.ps1 `
            -Version 0.0.0-ci -Channel nightly -OutputRoot artifacts/ci-release -Unsigned
          if ($LASTEXITCODE -ne 0) { throw "pack-release failed" }

          $release = "artifacts/ci-release/0.0.0-ci"
          $media = Join-Path $release "installer"
          foreach ($file in @(
            "ECL.Installer.exe",
            "ECL.Bootstrapper.exe",
            "update-manifest.json",
            "update-trust.json",
            "ECL-package.zip"
          )) {
            if (-not (Test-Path (Join-Path $media $file))) { throw "安装介质缺少 $file" }
          }

          $package = Join-Path $release "ECL-0.0.0-ci-win-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName }
            foreach ($required in @("ECL.exe", "ECL.LogHost.exe")) {
              if ($names -notcontains $required) { throw "程序包缺少 $required" }
            }
          }
          finally { $zip.Dispose() }

      # 用一次性测试密钥完成真实签名、静默安装与篡改拒绝，验证安装器端到端契约。
      - name: Verify silent install and tampered media rejection
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ci-signing.key"
          $pubPath = Join-Path $env:RUNNER_TEMP "ci-signing.pub"
          $rsa = [System.Security.Cryptography.RSA]::Create(3072)
          try {
            [System.IO.File]::WriteAllText($keyPath, $rsa.ExportPkcs8PrivateKeyPem())
            [System.IO.File]::WriteAllText($pubPath, $rsa.ExportSubjectPublicKeyInfoPem())
          }
          finally { $rsa.Dispose() }

          pwsh -NoProfile -File build/pack-release.ps1 `
            -Version 1.0.0-ci -Channel nightly -OutputRoot artifacts/ci-signed `
            -SigningKeyPath $keyPath -KeyId "ci" -PublicKeyPath $pubPath
          if ($LASTEXITCODE -ne 0) { throw "signed pack-release failed" }

          $media = "artifacts/ci-signed/1.0.0-ci/installer"
          $target = Join-Path $env:RUNNER_TEMP "ecl-ci-install"
          $installer = Join-Path $media "ECL.Installer.exe"
          $process = Start-Process -FilePath $installer `
            -ArgumentList @("--silent", "--install-root", $target) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "静默安装失败：$($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $target "current.json"))) { throw "安装后缺少 current.json" }
          $versionDir = Join-Path $target "versions/1.0.0-ci"
          if (-not (Test-Path (Join-Path $versionDir "ECL.exe"))) { throw "安装后缺少版本可执行文件" }

          # 篡改 Manifest 后必须 fail-closed，且不能生成 current 指针。
          $bad = Join-Path $env:RUNNER_TEMP "ecl-ci-bad-media"
          Copy-Item $media $bad -Recurse
          $manifest = Join-Path $bad "update-manifest.json"
          (Get-Content $manifest -Raw).Replace('1.0.0-ci', '9.9.9-tampered') | Set-Content $manifest -Encoding utf8NoBOM
          $badTarget = Join-Path $env:RUNNER_TEMP "ecl-ci-install-bad"
          $badProcess = Start-Process -FilePath (Join-Path $bad "ECL.Installer.exe") `
            -ArgumentList @("--silent", "--install-root", $badTarget) -PassThru -Wait
          if ($badProcess.ExitCode -eq 0) { throw "篡改介质被错误接受" }
          if (Test-Path (Join-Path $badTarget "current.json")) { throw "篡改介质不应生成 current 指针" }

  linux:
    name: Test (Linux, Core + CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/ECL.Tests/ECL.Tests.csproj

      - name: Test
        run: dotnet test tests/ECL.Tests/ECL.Tests.csproj -c Release --no-restore
